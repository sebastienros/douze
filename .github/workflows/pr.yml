name: PR Checks

on:

  # Every pull request, documentation included: the checks build the documentation site.
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:

    strategy:
      matrix:
        include:
        - { os: ubuntu-latest, rid: linux-x64 }
        - { os: macos-latest, rid: osx-arm64 }
        - { os: windows-latest, rid: win-x64 }

    runs-on: ${{ matrix.os }}
    env:
        DOTNET_NOLOGO: true
        DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Version
      run: dotnet --version

    - name: Test
      run: dotnet test -c Release

    # The documentation site (docs/) is a real site built by this Douze on every platform: a pull request that breaks
    # it, or that changes a feature without its pages, fails here.
    - name: Build the documentation site
      run: dotnet run --project Douze -c Release -- -s docs --no-cache --plain

    - uses: actions/setup-node@v7
      if: matrix.os == 'ubuntu-latest'
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: docs/package-lock.json

    - name: Check the documentation site (lint, links, Playwright)
      if: matrix.os == 'ubuntu-latest'
      working-directory: docs
      run: |
        npm ci
        npx playwright install --with-deps chromium
        npm run lint
        npm run check-links
        npm run test:e2e

    - uses: actions/upload-artifact@v7
      if: matrix.os == 'ubuntu-latest'
      with:
        name: docs-site
        path: docs/_site/douze
        retention-days: 7

    # The native AOT tool package of the platform, as build.yml and publish.yml make it.
    - name: Pack douze (native AOT, ${{ matrix.rid }})
      shell: bash
      run: dotnet pack Douze --configuration Release -r ${{ matrix.rid }} --property:PackTool=true --property:VersionSuffix=pr.${{ github.run_number }} --property:PackageOutputPath="${GITHUB_WORKSPACE}/tool-artifacts"

    # Installs the package with install.sh and install.ps1, and builds the Sample site and an image with it.
    - name: Smoke test douze and the install scripts
      shell: pwsh
      run: ./scripts/test-install.ps1 -Packages tool-artifacts -TestPath
