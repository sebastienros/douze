name: PR Checks

on:

  pull_request:
    branches: [ main ]
    paths-ignore:
    - 'doc/**'
    - 'README.md'
  workflow_dispatch:

jobs:
  build:

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    env:
        DOTNET_NOLOGO: true
        DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Version
      run: dotnet --version

    - name: Test
      run: dotnet test -c Release

    - name: Publish douze (native AOT)
      if: matrix.os == 'ubuntu-latest'
      run: dotnet publish Douze --configuration Release --output tool-out

    - name: Smoke test douze
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: ./tool-out/douze -s Sample -o site-out && test -f site-out/index.html
