name: Publish

# A v* tag publishes the tool packages to nuget.org and a GitHub Release with an archive per platform and the install
# scripts. Running the workflow by hand is a dry run: it builds and tests the same files, uploads them as artifacts of
# the run, and publishes nothing.

permissions:
  contents: read

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: The version of the dry run's packages
        type: string
        default: 0.0.0-dryrun

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  version:
    # Don't run on forks
    if: github.repository == 'sebastienros/douze'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - id: version
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if [ "$GITHUB_EVENT_NAME" = push ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="$INPUT_VERSION"; fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  test:
    # Don't run on forks
    if: github.repository == 'sebastienros/douze'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Test
      run: dotnet test -c Release

  packages:
    needs: version
    uses: ./.github/workflows/tool-packages.yml
    with:
      version: ${{ needs.version.outputs.version }}

  nuget:
    if: github.event_name == 'push'
    needs: [test, packages]
    runs-on: ubuntu-latest
    # NuGet trusted publishing: the API key is exchanged for a GitHub OIDC token
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - uses: actions/download-artifact@v7
      with:
        pattern: tool-*
        path: tool-artifacts
        merge-multiple: true

    - name: NuGet login
      id: nuget-login
      uses: NuGet/login@v1
      with:
        user: sebastienros

    # RID-specific packages (and the fallback, any) must be available before the top-level pointer package.
    - name: Push RID-specific packages
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push "tool-artifacts/Douze.[a-z]*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Push pointer package
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        VERSION: ${{ needs.packages.outputs.version }}
      run: dotnet nuget push "tool-artifacts/Douze.${VERSION}.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  # After nuget.org, which the install scripts read.
  release:
    if: github.event_name == 'push'
    needs: [packages, nuget]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v7
      with:
        name: release
        path: release

    - name: Create the GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.packages.outputs.version }}
      run: |
        set -euo pipefail
        prerelease=""
        case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
        gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "douze $VERSION" --generate-notes $prerelease
