name: Publish

permissions:
  contents: read

on:
  push:
    tags:
      - v*

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:

    # Don't run on forks
    if: github.repository == 'sebastienros/douze'
    runs-on: ubuntu-latest
    env:
        DOTNET_NOLOGO: true
        DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Test
      run: dotnet test -c Release

  tool-rid:
    # Don't run on forks
    if: github.repository == 'sebastienros/douze'
    name: douze ${{ matrix.rid }}
    strategy:
      fail-fast: true
      matrix:
        include:
        - { os: ubuntu-latest, rid: linux-x64 }
        - { os: ubuntu-24.04-arm, rid: linux-arm64 }
        - { os: windows-latest, rid: win-x64 }
        - { os: windows-11-arm, rid: win-arm64 }
        - { os: macos-15-intel, rid: osx-x64 }
        - { os: macos-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    env:
        DOTNET_NOLOGO: true
        DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Pack native AOT tool (${{ matrix.rid }})
      shell: bash
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        dotnet pack Douze --configuration Release -r ${{ matrix.rid }} --property:PackTool=true --property:Version=$VERSION --property:ContinuousIntegrationBuild=True --property:PackageOutputPath="${GITHUB_WORKSPACE}/tool-artifacts"

    # The image features need libvips next to the binary (NetVips.Native.<rid>, Douze.csproj).
    - name: Check the native library of the package (${{ matrix.rid }})
      shell: pwsh
      run: |
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $package = Get-ChildItem tool-artifacts -Filter "Douze.${{ matrix.rid }}.*.nupkg" | Select-Object -First 1
        $zip = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
        $found = $zip.Entries | Where-Object { $_.FullName -match '^tools/any/${{ matrix.rid }}/(lib)?vips[-.]42' }
        $zip.Dispose()
        if (-not $found) { throw "libvips is missing from $($package.Name)" }

    - uses: actions/upload-artifact@v6
      with:
        name: tool-${{ matrix.rid }}
        path: tool-artifacts/*.nupkg

  tool-publish:
    # Don't run on forks
    if: github.repository == 'sebastienros/douze'
    needs: [build, tool-rid]
    runs-on: ubuntu-latest
    # NuGet trusted publishing: the API key is exchanged for a GitHub OIDC token
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
        DOTNET_NOLOGO: true
        DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - uses: actions/download-artifact@v8
      with:
        pattern: tool-*
        path: tool-artifacts
        merge-multiple: true

    - name: Pack CoreCLR fallback and pointer package
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        PROPS="--configuration Release --property:PackTool=true --property:Version=$VERSION --property:ContinuousIntegrationBuild=True --property:PackageOutputPath=${GITHUB_WORKSPACE}/tool-artifacts"
        dotnet pack Douze $PROPS -r any --property:PublishAot=false
        rm -rf Douze/obj Douze/bin
        # Since .NET 11 the pointer package also packs the native AOT packages the host can build, without restoring
        # their RIDs: the tool-rid jobs already packed them.
        dotnet pack Douze $PROPS --property:CreateRidSpecificToolPackages=false

    - name: NuGet login
      id: nuget-login
      uses: NuGet/login@v1
      with:
        user: sebastienros

    # RID-specific packages must be available before the top-level pointer package.
    - name: Push RID-specific packages
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push "tool-artifacts/Douze.[a-z]*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Push pointer package
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        dotnet nuget push "tool-artifacts/Douze.${VERSION}.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
