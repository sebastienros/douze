name: Publish

on:
  push:
    tags:
      - v*

jobs:
  build:

    # Don't run on forks
    if: github.repository == 'sebastienros/douze'
    runs-on: ubuntu-latest
    env:
        DOTNET_NOLOGO: true
        DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Test
      run: dotnet test -c Release

  tool-rid:
    # Don't run on forks
    if: github.repository == 'sebastienros/douze'
    name: douze ${{ matrix.rid }}
    strategy:
      fail-fast: true
      matrix:
        include:
        - { os: ubuntu-latest, rid: linux-x64 }
        - { os: ubuntu-24.04-arm, rid: linux-arm64 }
        - { os: windows-latest, rid: win-x64 }
        - { os: windows-11-arm, rid: win-arm64 }
        - { os: macos-15-intel, rid: osx-x64 }
        - { os: macos-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    env:
        DOTNET_NOLOGO: true
        DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Pack native AOT tool (${{ matrix.rid }})
      shell: bash
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        dotnet pack Douze --configuration Release -r ${{ matrix.rid }} --property:PackTool=true --property:Version=$VERSION --property:ContinuousIntegrationBuild=True --property:PackageOutputPath="${GITHUB_WORKSPACE}/tool-artifacts"

    - uses: actions/upload-artifact@v6
      with:
        name: tool-${{ matrix.rid }}
        path: tool-artifacts/*.nupkg

  tool-publish:
    # Don't run on forks
    if: github.repository == 'sebastienros/douze'
    needs: [build, tool-rid]
    runs-on: ubuntu-latest
    env:
        DOTNET_NOLOGO: true
        DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - uses: actions/download-artifact@v7
      with:
        pattern: tool-*
        path: tool-artifacts
        merge-multiple: true

    - name: Pack CoreCLR fallback and pointer package
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        PROPS="--configuration Release --property:PackTool=true --property:Version=$VERSION --property:ContinuousIntegrationBuild=True --property:PackageOutputPath=${GITHUB_WORKSPACE}/tool-artifacts"
        dotnet pack Douze $PROPS -r any --property:PublishAot=false
        rm -rf Douze/obj Douze/bin
        dotnet pack Douze $PROPS

    # RID-specific packages must be available before the top-level pointer package.
    - name: Push RID-specific packages
      run: dotnet nuget push "tool-artifacts/Douze.[a-z]*.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Push pointer package
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        dotnet nuget push "tool-artifacts/Douze.${VERSION}.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
