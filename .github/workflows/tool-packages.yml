name: Tool packages

# Builds what a version of douze ships, without publishing it: the native AOT tool package of each platform (with
# libvips, without symbols), the CoreCLR fallback package (any) with the libvips of every platform, the pointer
# package, and an archive per platform for GitHub Releases. The install scripts are tested against the packages of
# Linux, macOS and Windows x64. build.yml pushes the packages to Feedz, publish.yml to nuget.org and the archives to a
# release.

on:
  workflow_call:
    inputs:
      version:
        description: The version of the packages (default <VersionPrefix>-preview.<run number>)
        type: string
        default: ''
    outputs:
      version:
        description: The version of the packages
        value: ${{ jobs.version.outputs.version }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v7

    - id: version
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ -z "$VERSION" ]; then
          prefix="$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Common.props)"
          VERSION="$prefix-preview.$GITHUB_RUN_NUMBER"
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Version $VERSION"

  rid:
    name: douze ${{ matrix.rid }}
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
        - { os: ubuntu-latest, rid: linux-x64 }
        - { os: ubuntu-24.04-arm, rid: linux-arm64 }
        - { os: windows-latest, rid: win-x64 }
        - { os: windows-11-arm, rid: win-arm64 }
        - { os: macos-15-intel, rid: osx-x64 }
        - { os: macos-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Pack native AOT tool (${{ matrix.rid }})
      shell: bash
      run: dotnet pack Douze --configuration Release -r ${{ matrix.rid }} --property:PackTool=true --property:Version="$VERSION" --property:ContinuousIntegrationBuild=True --property:PackageOutputPath="${GITHUB_WORKSPACE}/tool-artifacts"

    # The image features need libvips next to the binary (NetVips.Native.<rid>, Douze.csproj), the highlight step
    # Oniguruma (libonigwrap, from the Onigwrap package); the symbols are several times the size of the binary and stay
    # out.
    - name: Check the files of the package (${{ matrix.rid }})
      shell: pwsh
      run: |
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $package = Get-ChildItem tool-artifacts -Filter "Douze.${{ matrix.rid }}.*.nupkg" | Select-Object -First 1
        $zip = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
        $entries = $zip.Entries | ForEach-Object { $_.FullName }
        $zip.Dispose()
        $entries | ForEach-Object { Write-Host $_ }
        if (-not ($entries -match '^tools/any/${{ matrix.rid }}/(libvips-42\.dll|libvips\.42\.dylib|libvips\.so\.42)$')) { throw "libvips is missing from $($package.Name)" }
        if (-not ($entries -match '^tools/any/${{ matrix.rid }}/libonigwrap\.(dll|dylib|so)$')) { throw "libonigwrap is missing from $($package.Name)" }
        $symbols = $entries -match '\.(dSYM|dbg|pdb)(/|$)'
        if ($symbols) { throw "$($package.Name) has symbols: $symbols" }
        Write-Host "$($package.Name): $([math]::Round($package.Length / 1MB, 1)) MB"

    # The binary of the package runs on its platform (the runners are native ones, arm64 included): a site whose image
    # and code block need libvips and Oniguruma.
    - name: Run douze (${{ matrix.rid }})
      shell: pwsh
      run: |
        $package = Get-ChildItem tool-artifacts -Filter "Douze.${{ matrix.rid }}.*.nupkg" | Select-Object -First 1
        Expand-Archive -LiteralPath $package.FullName -DestinationPath extracted
        $douze = Join-Path extracted 'tools/any/${{ matrix.rid }}' ('${{ matrix.rid }}'.StartsWith('win') ? 'douze.exe' : 'douze')
        if (-not $IsWindows) { chmod +x $douze }
        & $douze -s scripts/install-test-site -o smoke --plain --no-cache
        if ($LASTEXITCODE -ne 0) { throw "douze exited with $LASTEXITCODE" }
        if (-not (Select-String -LiteralPath smoke/index.html -SimpleMatch 'style="--0:' -Quiet)) { throw 'the code block was not highlighted' }

    - uses: actions/upload-artifact@v7
      with:
        name: tool-${{ matrix.rid }}
        path: tool-artifacts/*.nupkg

  fallback:
    name: douze any and pointer package
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Pack CoreCLR fallback and pointer package
      run: |
        PROPS="--configuration Release --property:PackTool=true --property:Version=$VERSION --property:ContinuousIntegrationBuild=True --property:PackageOutputPath=${GITHUB_WORKSPACE}/tool-artifacts"
        dotnet pack Douze $PROPS -r any --property:PublishAot=false
        rm -rf Douze/obj Douze/bin
        # Since .NET 11 the pointer package also packs the native AOT packages the host can build, without restoring
        # their RIDs: the rid jobs already packed them.
        dotnet pack Douze $PROPS --property:CreateRidSpecificToolPackages=false
        ls -l tool-artifacts

    - name: Check the native libraries of the fallback package
      run: |
        set -euo pipefail
        entries="$(unzip -Z1 "tool-artifacts/Douze.any.$VERSION.nupkg")"
        for library in win-x64/native/libvips-42.dll win-arm64/native/libvips-42.dll linux-x64/native/libvips.so.42 \
            linux-arm64/native/libvips.so.42 osx-x64/native/libvips.42.dylib osx-arm64/native/libvips.42.dylib \
            win-x64/native/libonigwrap.dll win-arm64/native/libonigwrap.dll linux-x64/native/libonigwrap.so \
            linux-arm64/native/libonigwrap.so osx-x64/native/libonigwrap.dylib osx-arm64/native/libonigwrap.dylib; do
          echo "$entries" | grep -qx "tools/net11.0/any/runtimes/$library" || { echo "Douze.any lacks $library"; exit 1; }
        done
        if echo "$entries" | grep -E '\.pdb$'; then echo "Douze.any has symbols"; exit 1; fi

    - uses: actions/upload-artifact@v7
      with:
        name: tool-any
        path: |
          tool-artifacts/Douze.any.*.nupkg
          tool-artifacts/Douze.${{ needs.version.outputs.version }}.nupkg

  archives:
    name: release archives
    needs: [version, rid]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
    - uses: actions/checkout@v7

    - uses: actions/download-artifact@v8
      with:
        pattern: tool-*
        path: tool-artifacts
        merge-multiple: true

    # One archive per platform: the binary and libvips (the tool folder of its package), and the license. tar.gz keeps
    # the executable bit; Windows gets a zip.
    - name: Make the archives
      run: |
        set -euo pipefail
        mkdir -p release
        for rid in linux-x64 linux-arm64 osx-x64 osx-arm64 win-x64 win-arm64; do
          name="douze-$VERSION-$rid"
          rm -rf extract "$name"
          unzip -q "tool-artifacts/Douze.$rid.$VERSION.nupkg" -d extract
          mkdir "$name"
          cp -R "extract/tools/any/$rid/." "$name/"
          rm -f "$name/DotnetToolSettings.xml"
          cp LICENSE "$name/"
          case "$rid" in
            win-*)
              zip -q -X -r "release/$name.zip" "$name"
              ;;
            *)
              chmod +x "$name/douze"
              tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$(git log -1 --format=%ct)" -czf "release/$name.tar.gz" "$name"
              ;;
          esac
          rm -rf extract "$name"
        done
        cp install.sh install.ps1 release/
        (cd release && sha256sum -- * > SHA256SUMS)
        ls -l release
        cat release/SHA256SUMS

    - uses: actions/upload-artifact@v7
      with:
        name: release
        path: release/*

  install-scripts:
    name: install scripts (${{ matrix.os }})
    needs: [version, rid]
    strategy:
      fail-fast: false
      matrix:
        include:
        - { os: ubuntu-latest, rid: linux-x64 }
        - { os: windows-latest, rid: win-x64 }
        - { os: macos-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
    # For the local feed (scripts/test-feed.cs).
    - uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - uses: actions/download-artifact@v8
      with:
        name: tool-${{ matrix.rid }}
        path: tool-artifacts

    - name: Install, run and uninstall douze with install.sh and install.ps1
      shell: pwsh
      run: ./scripts/test-install.ps1 -Packages tool-artifacts -Version '${{ needs.version.outputs.version }}' -TestPath
